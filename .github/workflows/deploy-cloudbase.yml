name: Verify and deploy to CloudBase

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: cloudbase-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Verify and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.30.3

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify and build
        run: pnpm verify

      - name: Install CloudBase CLI
        run: npm install --global @cloudbase/cli@3.8.1

      - name: Deploy verified build to CloudBase
        env:
          TCB_ENV_ID: ${{ vars['TCB_ENV_ID'] }}
          TCB_SECRET_ID: ${{ secrets['TCB_SECRET_ID'] }}
          TCB_SECRET_KEY: ${{ secrets['TCB_SECRET_KEY'] }}
        run: |
          test -n "$TCB_ENV_ID" || { echo "::error::Missing repository variable TCB_ENV_ID"; exit 1; }
          test -n "$TCB_SECRET_ID" || { echo "::error::Missing repository secret TCB_SECRET_ID"; exit 1; }
          test -n "$TCB_SECRET_KEY" || { echo "::error::Missing repository secret TCB_SECRET_KEY"; exit 1; }
          tcb login --apiKeyId "$TCB_SECRET_ID" --apiKey "$TCB_SECRET_KEY"
          tcb app deploy matchus-fill-information \
            --env-id "$TCB_ENV_ID" \
            --framework static \
            --install-command "" \
            --build-command "" \
            --output-dir dist \
            --deploy-path / \
            --ignore "node_modules,.git,.github" \
            --force \
            --json
